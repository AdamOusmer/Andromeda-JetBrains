name: Build

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build plugin
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # IntelliJ 2026.2 class files need a JDK 25 javac to read; bytecode still targets 21 (options.release).
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Regenerate theme files and fail if they drift from the generators
        run: |
          set -euo pipefail
          python3 tools/gen_ui.py
          python3 tools/gen_scheme.py
          git diff --exit-code -- src/main/resources/themes

      - name: Build plugin
        run: ./gradlew buildPlugin --no-daemon --console=plain

      - name: Verify plugin against the target IDE
        run: ./gradlew verifyPlugin --no-daemon --console=plain
        continue-on-error: true

      - name: Upload plugin zip
        uses: actions/upload-artifact@v4
        with:
          name: andromeda-jetbrains
          path: build/distributions/*.zip
          if-no-files-found: error
