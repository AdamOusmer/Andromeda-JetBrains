name: Release

on:
  push:
    tags: [ "v*" ]

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # IntelliJ 2026.2 class files need a JDK 25 javac to read; bytecode still targets 21 (options.release).
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check tag matches Gradle version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          ver="$(sed -nE 's/^version = "([^"]+)"/\1/p' build.gradle.kts)"
          if [ "$tag" != "$ver" ]; then
            echo "Tag v$tag does not match build.gradle.kts version $ver"; exit 1
          fi

      - name: Build plugin
        run: ./gradlew buildPlugin --no-daemon --console=plain

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: build/distributions/*.zip
          generate_release_notes: true
